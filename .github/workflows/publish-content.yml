name: Publish CMS content to Git

# Bakes the live Supabase content into the repo (cms-content.json) so the static
# site is versioned in Git and visitors never hit the database.
# Trigger: "Run workflow" here, or the admin dashboard "Publish to Git" button
# (which sends a repository_dispatch of type "publish-cms").

on:
  repository_dispatch:
    types: [publish-cms]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Fetch content from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          curl -s "$SUPABASE_URL/rest/v1/cms_content?select=data&id=eq.1&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            | jq -r '.[0].data' > cms-content.json
          # Pretty-print for clean diffs
          jq . cms-content.json > cms-content.tmp && mv cms-content.tmp cms-content.json
          echo "Fetched $(wc -c < cms-content.json) bytes of content"

      - name: Commit and push
        run: |
          git config user.email "cms-bot@gozmardynamics.com"
          git config user.name "CMS Bot"
          git add cms-content.json
          if git diff --cached --quiet; then
            echo "No content changes to publish"
          else
            git commit -m "chore: publish CMS content from Supabase"
            git push
          fi
